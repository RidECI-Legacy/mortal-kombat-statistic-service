name: SonarQube Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' 
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov
        
      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=xml
        
      - name: Install SonarScanner
        run: |
          npm install -g sonar-scanner
          
      - name: Run SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=mortal-kombat-stats-service \
            -Dsonar.organization=rideci-legacy-1 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.sources=src \
            -Dsonar.tests=tests \
            -Dsonar.exclusions=**/application/**,**/core/**,**/domain/enums/**,**/domain/models/**,**/infrastructure/repositories/**,**/infrastructure/analytics/**,**/__init__.py,**/main.py,src/rideci/domain/services/AIAnalysisService.py,src/rideci/infrastructure/consumers/connection.py,src/rideci/infrastructure/consumers/main_worker.py,src/rideci/infrastructure/storage/S3StorageService.py